<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add my quote — sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070B;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-0.005em}
a,button,input,select,textarea{-webkit-tap-highlight-color:transparent}
a,button{transition:transform 220ms cubic-bezier(.2,.9,.25,1),background-color 200ms ease,border-color 200ms ease,opacity 200ms ease,box-shadow 220ms ease}
a:active,button:active{transform:scale(.97);transition-duration:90ms}
:focus-visible{outline:2px solid #4AA8FF;outline-offset:3px}
::selection{background:rgba(74,168,255,.35)}
html{scroll-behavior:smooth}
main,form:not(main form){animation:nb-rise 520ms cubic-bezier(.2,.9,.25,1) both}
@keyframes nb-rise{from{opacity:0;transform:translateY(10px) scale(.995)}}
@media (prefers-reduced-motion:reduce){main,form{animation:none!important}*{transition:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-transparency:reduce){header{background:#05070B!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF;opacity:.92}
</style>
</helmet>
<div style="min-height: 100vh; position: relative; background: #05070B; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 96px 32px; display: flex; flex-direction: column; gap: 20px; max-width: 1280px; margin: 0 auto; opacity: 0.5">
    <div style="height: 44px; width: 420px; border-radius: 12px; background: #131A23"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <div style="height: 120px; border-radius: 26px; background: #0E131A"></div>
      <div style="height: 120px; border-radius: 26px; background: #0E131A"></div>
      <div style="height: 120px; border-radius: 26px; background: #121922"></div>
    </div>
    <div style="height: 260px; border-radius: 28px; background: #0E131A"></div>
    <div style="height: 200px; border-radius: 28px; background: #0E131A"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px)"></div>

  <div style="position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; box-sizing: border-box">
    <form aria-label="Add my quote" style="width: 100%; max-width: 560px; border-radius: 34px; background: rgba(20,28,38,0.78); backdrop-filter: blur(50px) saturate(180%); -webkit-backdrop-filter: blur(50px) saturate(180%); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 40px 80px rgba(0,0,0,0.5); padding: 26px; display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; justify-content: space-between; align-items: center">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px">Add my quote</h1>
        <a href="Costs.dc.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="item" style="font-size: 13px; font-weight: 500; color: #98A4B3">Cost item</label>
        <select id="item" style="height: 50px; padding: 0 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #F5F5F7; font: 600 15px -apple-system, BlinkMacSystemFont, Inter, sans-serif">
          <option>Getting there · Studio deposit (5 weeks)</option>
          <option>Getting there · First month’s rent, studio</option>
          <option>Paperwork · TB test, approved Cape Town clinic</option>
          <option>Runway · Months 2 to 4 living</option>
          <option>+ My own cost (not in the baseline)</option>
        </select>
      </div>

      <div style="border-radius: 22px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.08); padding: 18px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <label for="amt" style="font-size: 13px; font-weight: 500; color: #98A4B3">Amount I found</label>
          <div style="display: flex; gap: 3px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.08)">
            <button type="button" style="padding: 6px 14px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.18); color: #F5F5F7; font: 600 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif">£ GBP</button>
            <button type="button" style="padding: 6px 14px; border-radius: 999px; border: 0; background: transparent; color: #98A4B3; font: 500 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif">R ZAR</button>
          </div>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-size: 44px; font-weight: 700; color: #98A4B3">£</span>
          <input id="amt" type="text" inputmode="decimal" value="1,040" style="width: 100%; border: 0; outline: 0; background: transparent; color: #F5F5F7; font: 700 44px -apple-system, BlinkMacSystemFont, Inter, sans-serif; letter-spacing: -1.4px; padding: 0">
        </div>
        <span style="font-size: 14px; color: #98A4B3">≈ R22,672 at £1 = R21.80</span>
        <div style="height: 1px; background: rgba(255,255,255,0.08)"></div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #CAD3DE"><span style="width: 10px; height: 10px; border-radius: 3px; background: #A9B4C8"></span>Baseline £1,212</span>
          <span style="padding: 6px 12px; border-radius: 999px; background: rgba(95,214,138,0.14); color: #5FD68A; font-size: 13px; font-weight: 600">−£172 under</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="src" style="font-size: 13px; font-weight: 500; color: #98A4B3">Where I found it</label>
          <input id="src" type="url" placeholder="Paste a link" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #F5F5F7; font: 500 14px -apple-system, BlinkMacSystemFont, Inter, sans-serif">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="when" style="font-size: 13px; font-weight: 500; color: #98A4B3">Date found</label>
          <input id="when" type="text" value="23 Nov 2026" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #F5F5F7; font: 500 14px -apple-system, BlinkMacSystemFont, Inter, sans-serif">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="note" style="font-size: 13px; font-weight: 500; color: #98A4B3">Note</label>
        <textarea id="note" rows="2" placeholder="e.g. Vox Trentham Street, studio, 12-month tenancy" style="padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #F5F5F7; font: 500 14px -apple-system, BlinkMacSystemFont, Inter, sans-serif; resize: none"></textarea>
      </div>

      <div style="display: flex; gap: 10px">
        <a href="Costs.dc.html" style="flex: 1; height: 52px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Cancel</a>
        <a href="Costs.dc.html" style="flex: 2; height: 52px; border-radius: 16px; background: {{accent}}; color: #05070B; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Save quote</a>
      </div>
      <p style="margin: 0; font-size: 12px; color: #8492A3; text-align: center">Older quotes for this item stay in its history.</p>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4AA8FF","options":["#4AA8FF","#64D2FF","#7D7AFF","#5FE3B0"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4AA8FF' };
  }
}
</script>
</body>
</html>
