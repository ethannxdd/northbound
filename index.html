<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16202b" />
    <meta name="description" content="Plan your move from Cape Town to the UK." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Northbound</title>
    <script>
      try { var t = localStorage.getItem('nb-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('pre')
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
